<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <title>Mis WebApps</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    header {
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 600;
    }

    /* Cuadrícula: 3 columnas máximo en Android vertical */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    .app-card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      aspect-ratio: 1 / 1.15;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, background-color 0.2s;
      border: 1px solid #2c2c2c;
    }

    .app-card:active {
      transform: scale(0.94);
      background-color: #2a2a2a;
    }

    .app-icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .app-title {
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.2;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mis Herramientas</h1>
  </header>

  <main class="grid-container" id="appGrid"></main>

  <script>
    const apps = [
      {
        nombre: "Árboles Castro",
        url: "https://fotovideorostik.github.io/arboles-castro/",
        icono: "🌳"
      },
      {
        nombre: "App Dado",
        url: "https://fotovideorostik.github.io/app-dado/",
        icono: "🎲"
      },
      {
        nombre: "Fruta Temporada",
        url: "https://fotovideorostik.github.io/Fruta-Temporada/",
        icono: "🍎"
      },
      {
        nombre: "Agenda Grabación",
        url: "https://fotovideorostik.github.io/agenda-edicion-grabacion/",
        icono: "📅"
      }
    ];

    const grid = document.getElementById('appGrid');

    apps.forEach((app) => {
      const card = document.createElement('a');
      card.className = 'app-card';
      card.href = app.url;
      card.innerHTML = `
        <div class="app-icon">${app.icono}</div>
        <div class="app-title">${app.nombre}</div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
